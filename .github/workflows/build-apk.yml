name: Build TriRead APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK (installable on phone)
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK (R8 minified)
        run: gradle assembleRelease --stacktrace

      - name: Print APK sizes
        run: |
          echo "### TriRead APK Build Sizes" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk | awk '{print "- `" $9 "` — **" $5 "**"}' >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TriRead-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: TriRead-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

