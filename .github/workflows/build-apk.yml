name: Build TriRead APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Restore shared debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: app/debug.keystore
          key: triread-shared-debug-keystore-v1

      - name: Generate shared debug keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storetype PKCS12 \
            -storepass triread123 \
            -keypass triread123 \
            -alias trireaddebug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TriRead Debug, O=TriRead, C=PH"

      - name: Build Debug APK (installable on phone)
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK (R8 minified)
        run: gradle assembleRelease --stacktrace

      - name: Prepare direct APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TriRead.apk

      - name: Print APK sizes
        run: |
          echo "### TriRead APK Build Sizes" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/TriRead.apk app/build/outputs/apk/release/*.apk | awk '{print "- `" $9 "` — **" $5 "**"}' >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriRead-debug-apk
          path: app/build/outputs/apk/debug/TriRead.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: TriRead-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Generate release notes
        id: notes
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          {
            echo "body<<EOF"
            echo "Build #${{ github.run_number }} (v1.0.${{ github.run_number }})"
            echo ""
            echo "What's New / Fixes:"
            echo "- ${COMMIT_MSG}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Publish direct APK to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "TriRead v1.0.${{ github.run_number }}"
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          files: |
            app/build/outputs/apk/debug/TriRead.apk
